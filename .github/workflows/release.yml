name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install Pillow

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: python generate_icon.py
      - run: flutter build windows --release

      - name: Create ZIP
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../RemoteSend-Windows-${{ github.ref_name }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: RemoteSend-Windows-${{ github.ref_name }}.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install Pillow

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: python generate_icon.py
      - run: flutter build apk --release --target-platform android-arm64

      - run: mv build/app/outputs/flutter-apk/app-release.apk RemoteSend-Android-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: RemoteSend-Android-${{ github.ref_name }}.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release

      - uses: actions/download-artifact@v4
        with:
          name: android-release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RemoteSend-Windows-${{ github.ref_name }}.zip
            RemoteSend-Android-${{ github.ref_name }}.apk
          body_path: release_notes.md
          draft: false
          prerelease: false
